<title>Portal Rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@1&family=DM+Mono:wght@400;500&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a fixed WebGL canvas (portal tunnel, stars, the coin) sits behind one visible "page" at a time; the coin is
   anchored to invisible slots in the page so it travels with the scroll. Picking a side flies the camera through the portal. */
:root {
  --bg: #07060b; --bg-2: #0e0d16; --bg-3: #16141f; --ink: #f3f1fa; --ink-2: #c0bad4; --ink-3: #8f89a6;
  --violet: #9a6bff; --violet-2: #c6abff; --cyan: #3ad0ff; --cyan-2: #9be9ff; --lav: #8e8cf6; --amber: #ffb070; --green: #7ef0b0; --red: #ff7a90;
  --line: rgba(255, 255, 255, .09); --line-2: rgba(255, 255, 255, .17); --glass: rgba(14, 13, 22, .72);
  --f-display: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; --f-serif: "Instrument Serif", Georgia, "Times New Roman", serif; --f-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace; --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --nav: 72px; --r: 16px; --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--f-display); -webkit-font-smoothing: antialiased; overflow-x: clip; cursor: default; }
body.fine, body.fine a, body.fine button, body.fine input, body.fine label { cursor: none; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-weight: 700; letter-spacing: -.03em; line-height: 1.02; text-wrap: balance; }
h1 { font-size: clamp(42px, 7.4vw, 104px); font-weight: 800; }
h2 { font-size: clamp(32px, 4.6vw, 60px); }
h3 { font-size: clamp(20px, 2vw, 26px); letter-spacing: -.02em; line-height: 1.2; }
em.hu { font-family: var(--f-serif); font-style: italic; font-weight: 400; letter-spacing: 0; color: var(--violet-2); }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 500 11px/1 var(--f-mono); letter-spacing: .28em; text-transform: uppercase; color: var(--ink-3); }
.eyebrow::before { content: ""; width: 22px; height: 1px; background: linear-gradient(90deg, var(--cyan), var(--violet)); }
.lead { font-size: clamp(17px, 1.35vw, 20px); color: var(--ink-2); max-width: 56ch; text-wrap: pretty; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 48px); }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
img { max-width: 100%; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#gl.off { display: none; }
main { position: relative; z-index: 1; transition: transform .6s var(--ease), opacity .5s, filter .5s; transform-origin: 50% 40%; }
body.warp main { transform: scale(1.08); opacity: 0; filter: blur(6px); }
.page { display: none; }
.page.on { display: block; }

/* ---------- nav ---------- */
.nav { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 40; height: var(--nav); display: flex; align-items: center; background: linear-gradient(180deg, rgba(7, 6, 11, .9), rgba(7, 6, 11, .55)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 18px; }
.nav .prog { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; transform-origin: left; transform: scaleX(var(--p, 0)); background: linear-gradient(90deg, var(--cyan), var(--violet)); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; letter-spacing: -.01em; }
.logo svg { width: 34px; height: 34px; transition: transform .5s var(--ease); }
.logo:hover svg { transform: rotate(14deg); }
.logo span { white-space: nowrap; }
.logo small { display: block; font: 500 10px/1 var(--f-mono); letter-spacing: .22em; color: var(--ink-3); margin-top: 3px; }
.nav-links { display: flex; gap: 4px; margin-inline: auto; }
.nav-links a { font-size: 14px; font-weight: 500; color: var(--ink-2); text-decoration: none; padding: 8px 12px; border-radius: 999px; transition: color .2s, background .2s; }
.nav-links a:hover { color: var(--ink); background: rgba(255, 255, 255, .06); }
.switch { display: inline-flex; padding: 3px; border: 1px solid var(--line-2); border-radius: 999px; background: rgba(255, 255, 255, .03); }
.switch a { position: relative; z-index: 1; font: 600 12px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 14px; border-radius: 999px; text-decoration: none; color: var(--ink-2); transition: color .25s; }
.switch a.on { color: #0b0a12; }
.switch a.on.c { background: var(--cyan); } .switch a.on.b { background: var(--violet-2); }
.sound { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); font: 600 11px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; }
.sound i { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
.sound i b { width: 2px; height: 4px; background: currentColor; border-radius: 1px; transform-origin: bottom; }
.sound.on { color: var(--cyan-2); border-color: rgba(58, 208, 255, .5); }
.sound.on i b { animation: eq 1s ease-in-out infinite; }
.sound.on i b:nth-child(2) { animation-delay: .15s; } .sound.on i b:nth-child(3) { animation-delay: .3s; } .sound.on i b:nth-child(4) { animation-delay: .45s; }
@keyframes eq { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(3); } }
.burger { display: none; width: 40px; height: 40px; border: 1px solid var(--line-2); border-radius: 999px; background: transparent; }
.burger span { display: block; width: 16px; height: 2px; margin: 3px auto; background: var(--ink); border-radius: 2px; }
@media (max-width: 900px) { .nav .wrap { gap: 10px; } .nav-links { display: none; } .burger { display: block; } .switch { margin-left: auto; } .switch a { padding: 8px 10px; font-size: 11px; } .sound span { display: none; } .sound { width: 36px; padding: 0; justify-content: center; } .logo span { display: none; } }
.menu { position: fixed; top: calc(var(--nav) + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 39; background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); padding: 12px 16px 18px; display: grid; gap: 4px; }
.menu[hidden] { display: none; }
.menu a { padding: 12px 10px; border-radius: 10px; text-decoration: none; font-weight: 600; color: var(--ink-2); }
.menu a:hover { background: rgba(255, 255, 255, .06); color: var(--ink); }

/* ---------- buttons ---------- */
.btn { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); color: var(--ink); font-weight: 600; font-size: 15px; text-decoration: none; letter-spacing: -.005em; transition: transform .25s var(--ease), background .25s, border-color .25s, box-shadow .25s; will-change: transform; }
.btn:hover { background: rgba(255, 255, 255, .09); border-color: rgba(255, 255, 255, .3); }
.btn.pri { background: var(--ink); color: #0b0a12; border-color: transparent; box-shadow: 0 10px 30px -14px rgba(154, 107, 255, .6); }
.btn.pri:hover { background: #fff; box-shadow: 0 16px 40px -14px rgba(154, 107, 255, .9); }
.btn.c { background: linear-gradient(135deg, var(--cyan), #6cb8ff); color: #061018; border-color: transparent; }
.btn.b { background: linear-gradient(135deg, var(--violet), #c58cff); color: #140a26; border-color: transparent; }
.btn .arr { transition: transform .25s var(--ease); } .btn:hover .arr { transform: translate(3px, -3px); }
.btn.sm { height: 42px; padding: 0 16px; font-size: 14px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); } .btn.ghost:hover { color: var(--ink); background: rgba(255, 255, 255, .06); }
.btn.press { transform: scale(.97); }

/* ---------- hero (home) ---------- */
.hero { position: relative; min-height: calc(100svh - var(--nav)); padding-top: calc(var(--nav) + 4vh); display: grid; place-items: end center; text-align: center; padding-bottom: 36px; }
.hero .slot { width: min(40vw, 340px); aspect-ratio: 1; border-radius: 50%; outline-offset: 10px; }
@media (min-width: 700px) { .hero .slot { position: absolute; left: 50%; top: calc(var(--nav) + (100svh - var(--nav)) * .34); transform: translate(-50%, -50%); width: min(30vw, 290px); } }
@media (max-width: 699px) { .hero .slot { width: min(86vw, 380px); } }
.hero::before { content: ""; position: absolute; left: 50%; bottom: 0; width: min(1100px, 100%); height: 56%; transform: translateX(-50%); pointer-events: none; background: radial-gradient(50% 62% at 50% 64%, rgba(7, 6, 11, .86), rgba(7, 6, 11, .6) 48%, transparent 76%); }
.hero-copy > *:not(.slot) { position: relative; }
@media (min-width: 700px) { .hero-copy > .eyebrow, .hero-copy > .hint-tap { display: none !important; } }
.hero-copy h1, .hero-copy .lead, .hero-copy .eyebrow, .hero-copy .hint { text-shadow: 0 2px 28px rgba(7, 6, 11, .95), 0 0 3px rgba(7, 6, 11, .7); }
.hint-tap { display: none; } body:not(.fine) .hint-tap { display: inline-flex; margin-top: -6px; }
.hero-copy { display: grid; gap: 18px; justify-items: center; max-width: 860px; padding-bottom: 12px; }
.hero-copy h1 { font-weight: 300; letter-spacing: -.035em; }
.hero-copy h1 b { font-weight: 800; }
.hero-copy .lead { text-align: center; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 6px; }
.hint { display: inline-flex; gap: 12px; align-items: center; font: 500 11px/1 var(--f-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-3); margin-top: 14px; }
.hint i { width: 1px; height: 28px; background: linear-gradient(var(--lav), transparent); }
.toss { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 13px/1 var(--f-mono); letter-spacing: .2em; color: var(--amber); pointer-events: none; opacity: 0; }
.toss.show { animation: tossUp 1.3s var(--ease) forwards; }
@keyframes tossUp { 0% { opacity: 0; transform: translate(-50%, -30%); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -180%); } }

/* ---------- generic sections ---------- */
.sec { position: relative; padding-block: clamp(64px, 9vw, 120px); }
.sec-head { display: grid; gap: 14px; max-width: 760px; margin-bottom: clamp(28px, 4vw, 52px); }
.sec-head.center { text-align: center; margin-inline: auto; justify-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.card { position: relative; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .015)); border-radius: var(--r); padding: 26px; min-width: 0; }
.tilt { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--ty, 0px)); transition: transform .35s var(--ease), border-color .4s; }
.rv { transition: transform .9s var(--ease), opacity .9s var(--ease); transform: translateY(18px); opacity: .55; }
.rv.in { transform: none; opacity: 1; }
.glow-c { box-shadow: inset 0 0 0 1px rgba(58, 208, 255, .18), 0 30px 80px -50px rgba(58, 208, 255, .55); }
.glow-b { box-shadow: inset 0 0 0 1px rgba(154, 107, 255, .22), 0 30px 80px -50px rgba(154, 107, 255, .6); }

/* two sides */
.sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 900px) { .sides { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 14px; padding: clamp(24px, 3vw, 40px); min-height: 360px; align-content: end; text-decoration: none; color: inherit; overflow: hidden; isolation: isolate; }
.side:hover { --ty: -4px; border-color: var(--line-2); }
.side .orb { position: absolute; width: 360px; height: 360px; border-radius: 50%; filter: blur(70px); opacity: .35; z-index: -1; right: -120px; top: -140px; transition: opacity .5s, transform .8s var(--ease); }
.side:hover .orb { opacity: .6; transform: scale(1.15); }
.side.c .orb { background: var(--cyan); } .side.b .orb { background: var(--violet); }
.side h3 { font-size: clamp(28px, 3vw, 40px); font-weight: 300; letter-spacing: -.03em; }
.side h3 b { font-weight: 800; }
.side .go { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; margin-top: 6px; }
.side.c .go { color: var(--cyan-2); } .side.b .go { color: var(--violet-2); }
.side .arr { transition: transform .3s var(--ease); } .side:hover .arr { transform: translateX(6px); }
.side .ringlet { position: absolute; right: 26px; top: 26px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid currentColor; opacity: .35; transition: transform .8s var(--ease), opacity .5s; }
.side:hover .ringlet { transform: scale(1.25) rotate(90deg); opacity: .8; }
.side.c .ringlet { color: var(--cyan); } .side.b .ringlet { color: var(--violet-2); }

/* how it works */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.step { display: grid; grid-template-rows: auto auto 1fr; gap: 18px; padding: 20px; }
.step .num { font: 500 11px/1 var(--f-mono); letter-spacing: .26em; color: var(--ink-3); display: flex; justify-content: space-between; }
.step h3 { font-size: 22px; }
.step p { color: var(--ink-2); font-size: 15px; }
.demo { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: radial-gradient(120% 90% at 50% 100%, rgba(154, 107, 255, .12), transparent 60%), #0b0a12; overflow: hidden; display: grid; place-items: center; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.coin2d { width: 100%; height: 100%; border-radius: 50%; display: block; box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .8); }
.c2 { position: absolute; width: 38%; aspect-ratio: 1; }
.demo .state { position: absolute; left: 12px; bottom: 10px; font: 500 10px/1 var(--f-mono); letter-spacing: .24em; text-transform: uppercase; color: var(--ink-3); transition: color .3s; }
.demo.open .state, .demo.go .state { color: var(--green); }
/* step 1: the pouch (SVG) with the coin rising out of its pocket */
.demo.find svg.pouch { position: absolute; left: 50%; bottom: 0; width: 60%; height: 92%; transform: translateX(-50%); overflow: visible; }
.demo.find .pocket { position: absolute; left: 50%; bottom: 12%; width: 60%; height: 74%; transform: translateX(-50%); overflow: hidden; pointer-events: none; }
.demo.find .pocket .c2 { position: absolute; left: 50%; top: 38%; width: 58%; transform: translate(-50%, 0) rotate(-10deg); transition: transform .8s var(--ease), filter .8s; filter: brightness(.55); }
.demo.find.open .pocket .c2 { transform: translate(-50%, -78%) rotate(4deg); filter: brightness(1) drop-shadow(0 0 18px rgba(154, 107, 255, .7)); }
.demo.find .flap { transform-origin: 50% 100%; transition: transform .7s var(--ease); }
.demo.find.open .flap { transform: translateY(-14px) rotate(-6deg); }
.demo.find .zip { stroke-dasharray: 160; stroke-dashoffset: 0; transition: stroke-dashoffset .7s var(--ease); }
.demo.find.open .zip { stroke-dashoffset: 160; }
.demo.find .beans { opacity: 0; transition: opacity .4s .3s; } .demo.find.open .beans { opacity: 1; }
.demo.find .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); opacity: 0; pointer-events: none; }
/* step 2: the phone scan */
.phone { position: relative; width: 44%; aspect-ratio: 9 / 16; max-height: 86%; border-radius: 22px; background: #0a0912; border: 2px solid #2b2740; box-shadow: 0 30px 70px -30px #000, inset 0 0 0 1px rgba(255, 255, 255, .06); overflow: hidden; }
.phone::before { content: ""; position: absolute; top: 8px; left: 50%; width: 36%; height: 8px; transform: translateX(-50%); border-radius: 6px; background: #000; }
.phone .cam { position: absolute; inset: 14% 10% 30%; border-radius: 10px; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(58, 208, 255, .12), transparent 60%); }
.phone .cam .c2 { position: static; width: 70%; }
.phone .corner { position: absolute; width: 16px; height: 16px; border: 2px solid var(--cyan); transition: transform .4s var(--ease); }
.demo.go .phone .corner { transform: scale(.85); }
.phone .corner.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; } .phone .corner.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
.phone .corner.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; } .phone .corner.br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
.phone .beam { position: absolute; left: 6%; right: 6%; top: 20%; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); box-shadow: 0 0 18px 4px rgba(58, 208, 255, .45); opacity: 0; }
.phone .label { position: absolute; left: 0; right: 0; bottom: 14%; text-align: center; font: 500 10px/1 var(--f-mono); letter-spacing: .22em; color: var(--ink-3); text-transform: uppercase; }
.phone .shutter { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); width: 58px; height: 58px; display: grid; place-items: center; }
.phone .shutter::after { content: ""; width: 40px; height: 40px; border-radius: 50%; background: #fff; transition: transform .2s; }
.demo.go .phone .shutter::after { transform: scale(.85); }
.phone .shutter svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.phone .shutter circle { fill: none; stroke-width: 3; }
.phone .shutter .track { stroke: rgba(255, 255, 255, .25); }
.phone .shutter .fill { stroke: var(--cyan); stroke-dasharray: 170; stroke-dashoffset: 170; }
.demo.go .phone .shutter .fill { animation: ring 2.2s linear forwards; }
@keyframes ring { to { stroke-dashoffset: 0; } }
.demo.go .beam { opacity: 1; animation: beam 1.1s var(--ease) 2; }
@keyframes beam { 0% { top: 16%; } 100% { top: 84%; } }
.toast { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -24px); background: rgba(126, 240, 176, .14); border: 1px solid rgba(126, 240, 176, .5); color: var(--green); font: 600 12px/1 var(--f-mono); letter-spacing: .08em; padding: 10px 14px; border-radius: 999px; opacity: 0; transition: transform .5s var(--ease), opacity .4s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* step 3: wallet */
.wallet { width: 72%; border-radius: 16px; background: linear-gradient(160deg, #19152a, #0d0b16); border: 1px solid var(--line-2); padding: 16px; display: grid; gap: 10px; }
.wallet .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); }
.wallet .big { font-size: 34px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--ink); }
.wallet .bar { height: 6px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.wallet .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--cyan), var(--violet)); transition: width .8s var(--ease); }
.wallet .redeem { height: 38px; border-radius: 10px; border: 0; background: var(--ink); color: #0b0a12; font-weight: 700; font-size: 13px; }
.fly { position: absolute; width: 26px; height: 26px; border-radius: 50%; pointer-events: none; will-change: transform, opacity; }

/* story: the timeline and the hand-drawn storyboard */
.story { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: clamp(24px, 5vw, 64px); align-items: center; }
@media (max-width: 900px) { .story { grid-template-columns: minmax(0, 1fr); } }
.story .clock { font: 500 12px/1 var(--f-mono); letter-spacing: .26em; color: var(--amber); text-transform: uppercase; }
.story h2 { font-weight: 400; font-size: clamp(24px, 2.6vw, 36px); line-height: 1.15; letter-spacing: -.02em; }
.story h2 em { color: var(--amber); }
.timeline { display: grid; border-left: 1px solid var(--line-2); margin: 18px 0 0 8px; padding: 0; }
.timeline li { list-style: none; position: relative; padding: 12px 0 12px 26px; color: var(--ink-2); cursor: pointer; border-radius: 0 10px 10px 0; transition: background .3s; }
.timeline li:hover { background: rgba(255, 255, 255, .04); }
.timeline li::before { content: ""; position: absolute; left: -5px; top: 20px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--lav); transition: background .3s, transform .3s; }
.timeline li.on::before { background: var(--amber); border-color: var(--amber); transform: scale(1.3); }
.timeline li b { display: block; color: var(--ink); font-weight: 600; }
.board { position: relative; border-radius: var(--r); border: 1px solid var(--line); background: #0b0a12; aspect-ratio: 8 / 5.6; max-width: 100%; overflow: hidden; }
.board svg { display: block; width: 100%; height: 100%; }
.board .sk { fill: none; stroke: #ece9f5; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.board .sk.am { stroke: var(--amber); } .board .sk.vi { stroke: var(--violet-2); } .board .sk.cy { stroke: var(--cyan); } .board .sk.dim { stroke: #5a5570; stroke-dasharray: 4 6; }
